<script>
(() => {
  const root = document.getElementById('bbc-navgraph');
  const data = JSON.parse(document.getElementById('bbc-graph-data').textContent);
  const $ = id => root.querySelector('#bbc-' + id);
  const nodes = data.n, outgoing = nodes.map(() => new Map()), incoming = nodes.map(() => new Map());
  const key = n => n[0] + n[1];
  const byKey = new Map(nodes.map((n,i) => [key(n),i]));
  data.e.forEach(([a,b,p]) => { if (a!==b) { outgoing[a].set(b,p); incoming[b].set(a,p); } });
  const groupMembers = data.g.map((_,g) => nodes.map((n,i) => n[2]===g ? i : -1).filter(i=>i>=0));
  const groupEdges = new Map();
  data.e.forEach(([a,b]) => { const ga=nodes[a][2],gb=nodes[b][2]; if(ga!==gb){const k=ga+','+gb;groupEdges.set(k,(groupEdges.get(k)||0)+1);} });
  const number = n => n.toLocaleString('fr-FR');
  let mode='overview', focus=byKey.get('www.blablacar.fr/') ?? 0, pageIn=0, pageOut=0, notes={};
  const perPage=6;
  const stats=data.s;
  $('metrics').textContent=number(stats.verified_seed_pages)+' adresses contrôlées · '+number(stats.distinct_linked_in_scope_pages)+' pages liées · '+number(stats.absolute_route_templates)+' modèles de routes';
  const svgNS='http://www.w3.org/2000/svg';
  const svgEl=(tag,attrs={})=>{const e=document.createElementNS(svgNS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));return e;};
  function shorten(text,width) {
    const max=Math.max(9,Math.floor(width/8));
    if(text.length<=max)return text;
    const last=text.split('/').filter(Boolean).slice(-1)[0]||text;
    const compact='/…/'+last;
    return compact.length<=max?compact:compact.slice(0,max-1)+'…';
  }
  function score(i){const n=nodes[i];return (n[3]===200?40:0)+Math.min(outgoing[i].size,30)+(n[6]?15:0)-n[1].length*.05;}
  function sorted(items){return [...items].sort((a,b)=>score(b)-score(a)||nodes[a][1].localeCompare(nodes[b][1]));}
  function save(){
    if(!window.openai?.setWidgetState)return;
    const selected=mode==='page'?key(nodes[focus]):null;
    window.openai.setWidgetState({modelContent:{visualization:'bbc-navigation-v1',page:selected,view:mode},privateContent:{version:'bbc-navigation-v1',focus:selected,mode,notes,pageIn,pageOut}}).catch(()=>{});
  }
  function restore(value){
    const p=value?.privateContent;
    if(p?.version!=='bbc-navigation-v1')return false;
    notes=p.notes&&typeof p.notes==='object'?p.notes:{};
    mode=p.mode==='page'?'page':'overview';
    if(p.focus&&byKey.has(p.focus))focus=byKey.get(p.focus);
    pageIn=Math.max(0,Number(p.pageIn)||0);pageOut=Math.max(0,Number(p.pageOut)||0);
    return true;
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(restore(event.detail?.globals?.widgetState))render();});
  function selectPage(i){focus=i;mode='page';pageIn=pageOut=0;$('matches').replaceChildren();$('search').value='';render();save();}
  function newCanvas(height){
    const stage=$('stage');stage.replaceChildren();stage.style.height=height+'px';
    const svg=svgEl('svg',{'class':'bbc-connectors','aria-hidden':'true'});
    const defs=svgEl('defs');
    [['neutral','var(--border)'],['active','var(--viz-series-1)']].forEach(([name,color])=>{
      const marker=svgEl('marker',{id:'bbc-arrow-'+name,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});
      marker.append(svgEl('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:color}));defs.append(marker);
    });
    svg.append(defs);stage.append(svg);return svg;
  }
  function connect(svg,a,b,active=false,both=false){
    const dx=b.x-a.x,dy=b.y-a.y;
    const start={x:a.x,y:a.y},end={x:b.x,y:b.y};
    if(Math.abs(dx)>Math.abs(dy)*.8){start.x+=Math.sign(dx)*a.w/2;end.x-=Math.sign(dx)*b.w/2;}
    else{start.y+=Math.sign(dy)*25;end.y-=Math.sign(dy)*25;}
    const middle=(start.x+end.x)/2;
    const curve=svgEl('path',{d:`M ${start.x} ${start.y} C ${middle} ${start.y}, ${middle} ${end.y}, ${end.x} ${end.y}`,fill:'none',stroke:active?'var(--viz-series-1)':'var(--border)','stroke-width':active?1.6:1.1,opacity:active?.8:.55,'marker-end':'url(#bbc-arrow-'+(active?'active':'neutral')+')'});
    if(both)curve.setAttribute('marker-start','url(#bbc-arrow-active)');svg.append(curve);
  }
  function nodeButton(point,label,caption,onClick,active=false,tooltip=''){
    const wrapper=document.createElement('div');wrapper.className='bbc-node';
    Object.assign(wrapper.style,{left:(point.x-point.w/2)+'px',top:(point.y-22)+'px',width:point.w+'px'});
    const b=document.createElement('button');b.type='button';b.className='btn btn-block'+(active?' btn-primary':'');b.textContent=label;
    b.setAttribute('aria-label',tooltip||label);if(tooltip)b.setAttribute('data-tooltip',tooltip);b.onclick=onClick;wrapper.append(b);
    if(caption){const c=document.createElement('span');c.className='text-small text-muted bbc-node-caption';c.textContent=caption;wrapper.append(c);}
    $('stage').append(wrapper);
  }
  function pickGroup(g){
    const preferred=['/','/carpool','/bus','/train','/login','/dashboard/profile/menu','/offer-seats','/rides','/messages/list','/apps-mobile','/blablahome','/'];
    const direct=byKey.get('www.blablacar.fr'+preferred[g]);
    const i=direct!==undefined&&nodes[direct][2]===g?direct:sorted(groupMembers[g])[0];
    if(i!==undefined)selectPage(i);
  }
  function renderOverview(){
    $('view-title').textContent='Liens entre rubriques';$('view-summary').textContent='Flèches dirigées · liens HTML et menus observés';
    $('pagination').hidden=true;$('detail').hidden=true;
    const width=$('stage').clientWidth||736;
    const columns=width<420?2:3;
    const height=Math.ceil(data.g.length/columns)*106+22;
    const svg=newCanvas(height), nodeWidth=Math.min(220,width/columns-22), points=new Map();
    data.g.forEach((name,g)=>points.set(g,{x:(g%columns+.5)*width/columns,y:50+Math.floor(g/columns)*106,w:nodeWidth}));
    groupEdges.forEach((count,k)=>{const [a,b]=k.split(',').map(Number);connect(svg,points.get(a),points.get(b));});
    data.g.forEach((name,g)=>{
      const members=groupMembers[g], linked=members.filter(i=>nodes[i][6]).length;
      nodeButton(points.get(g),name,number(linked)+' liées · '+number(members.filter(i=>nodes[i][5]).length)+' déclarées',()=>pickGroup(g),g===0,name+' : '+members.length+' entrées');
    });
  }
  function columnLabel(text,x,width){const d=document.createElement('div');d.className='bbc-column text-small';d.textContent=text;Object.assign(d.style,{left:(x-width/2)+'px',top:'0px',width:width+'px'});$('stage').append(d);}
  function describe(i){const n=nodes[i];if(n[2]===11)return 'Hors scope';if(n[3])return 'HTTP '+n[3];return n[5]&&!n[6]?'◇ Déclarée':'Lien observé';}
  function renderPage(){
    const n=nodes[focus],ins=sorted(incoming[focus].keys()),outs=sorted(outgoing[focus].keys());
    pageIn=Math.min(pageIn,Math.max(0,Math.ceil(ins.length/perPage)-1));pageOut=Math.min(pageOut,Math.max(0,Math.ceil(outs.length/perPage)-1));
    const left=ins.slice(pageIn*perPage,(pageIn+1)*perPage),right=outs.slice(pageOut*perPage,(pageOut+1)*perPage);
    const width=$('stage').clientWidth||736, nodeWidth=Math.min(230,width*.27),rows=Math.max(left.length,right.length,3),height=rows*80+40;
    const svg=newCanvas(height),center={x:width/2,y:height/2,w:nodeWidth};
    $('view-title').textContent=data.g[n[2]];
    $('view-summary').textContent=number(ins.length)+' pages sources · '+number(outs.length)+' liens sortants';
    columnLabel('Sources',width*.15,nodeWidth);columnLabel('Page choisie',width/2,nodeWidth);columnLabel('Destinations',width*.85,nodeWidth);
    left.forEach((i,index)=>{
      const p={x:width*.15,y:65+index*80,w:nodeWidth};connect(svg,p,center,true);
      nodeButton(p,shorten(nodes[i][2]===11?nodes[i][0]:nodes[i][1],nodeWidth),describe(i),()=>selectPage(i),false,'https://'+key(nodes[i]));
    });
    right.forEach((i,index)=>{
      const p={x:width*.85,y:65+index*80,w:nodeWidth};connect(svg,center,p,true);
      nodeButton(p,shorten(nodes[i][2]===11?nodes[i][0]:nodes[i][1],nodeWidth),describe(i),()=>selectPage(i),false,'https://'+key(nodes[i]));
    });
    nodeButton(center,shorten(n[2]===11?n[0]:n[1],nodeWidth),describe(focus),()=>{},true,'https://'+key(n));
    if(!ins.length&&!outs.length){const empty=document.createElement('div');empty.className='bbc-empty text-small';empty.textContent=n[5]?'Route déclarée dans le frontend. Aucun lien de navigation observé dans les captures.':'Aucun lien entrant ou sortant observé dans les captures.';$('stage').append(empty);}
    $('pagination').hidden=!ins.length&&!outs.length;
    $('prev-in').disabled=pageIn===0;$('next-in').disabled=(pageIn+1)*perPage>=ins.length;
    $('prev-out').disabled=pageOut===0;$('next-out').disabled=(pageOut+1)*perPage>=outs.length;
    $('detail').hidden=false;$('page-name').textContent='https://'+key(n);
    $('page-facts').textContent=[describe(focus),n[6]?'Lien réellement observé':n[5]?'Déclaration uniquement':'Point d’entrée vérifié',n[8]?'Réserve de transport TLS':''].filter(Boolean).join(' · ');
    $('page-title').textContent=n[4]||'';
    $('page-proof').textContent=n[7]?'Capture : '+n[7]:n[2]===11?'Destination externe repérée, non visitée.':'Aucune réponse HTTP capturée pour cette entrée.';
    const annotation=data.a['https://'+key(n)];
    $('note').value=notes[key(n)]??(typeof annotation==='string'?annotation:annotation?.note||'');$('note-status').textContent='';
  }
  function render(){if(mode==='overview')renderOverview();else renderPage();}
  $('overview').onclick=()=>{mode='overview';$('search').value='';$('matches').replaceChildren();render();save();};
  $('search').oninput=()=>{
    const q=$('search').value.trim().toLowerCase();$('matches').replaceChildren();if(!q)return;
    const found=sorted(nodes.map((n,i)=>key(n).toLowerCase().includes(q)?i:-1).filter(i=>i>=0));
    found.slice(0,8).forEach(i=>{const b=document.createElement('button');b.type='button';b.className='btn btn-ghost';const n=nodes[i];b.textContent=shorten(n[2]===11?n[0]+n[1]:n[1],300)+' · '+describe(i);b.setAttribute('data-tooltip','https://'+key(n));b.onclick=()=>selectPage(i);$('matches').append(b);});
    if(!found.length){const t=document.createElement('span');t.className='text-small';t.textContent='Aucune page correspondante';$('matches').append(t);}
  };
  $('search').onkeydown=e=>{if(e.key==='Enter'){const first=$('matches').querySelector('button');if(first)first.click();}};
  [['prev-in',()=>pageIn=Math.max(0,pageIn-1)],['next-in',()=>pageIn++],['prev-out',()=>pageOut=Math.max(0,pageOut-1)],['next-out',()=>pageOut++]].forEach(([id,change])=>$(id).onclick=()=>{change();render();save();});
  $('note').onchange=()=>{
    const k=key(nodes[focus]),value=$('note').value.slice(0,400);
    if(value&&!notes[k]&&Object.keys(notes).length>=20){$('note-status').textContent='La vue peut mémoriser 20 notes. Cette note reste affichée dans la session.';return;}
    if(value)notes[k]=value;else delete notes[k];save();$('note-status').textContent=window.openai?.setWidgetState?'Note mémorisée dans cette vue.':'Note conservée pour cette session.';
  };
  let previousWidth=0;
  new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(Math.abs(width-previousWidth)>3){previousWidth=width;render();}}).observe(root);
  render();
})();
</script>
